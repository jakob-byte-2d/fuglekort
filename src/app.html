<title>Hagefugler</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Familjen+Grotesk:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#e1e8e0; --bg-hi:#f3f6f0; --ink:#15251e; --muted:#586a61; --line:#c6d2c8;
  --surface:#f7f9f4; --surface-2:#e9efe8; --spruce:#0f4a36; --spruce-ink:#0f4a36; --on-spruce:#f3f8f2;
  --gold:#eea914; --gold-ink:#8a5a00; --track:#cfdacf; --shadow:22,44,33; --scrim:rgba(12,26,20,.36);
  --card-cream:#fdfcf3; --card-ink:#14231d; --card-teal:#d5eeee; --card-gold:#f4b41a; --card-green:#0f4a36; --pen:#1c3aa0;
  --font:"Familjen Grotesk", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --hand:"Caveat", "Segoe Print", "Bradley Hand", "Comic Sans MS", cursive;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0c1712; --bg-hi:#18291f; --ink:#e3ebe5; --muted:#8fa298; --line:#26392f;
    --surface:#122019; --surface-2:#1a2b22; --spruce:#1d6a4d; --spruce-ink:#8bd0aa; --on-spruce:#f3f8f2;
    --gold:#f2b421; --gold-ink:#f2c24f; --track:#26382e; --shadow:0,0,0; --scrim:rgba(0,0,0,.56);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0c1712; --bg-hi:#18291f; --ink:#e3ebe5; --muted:#8fa298; --line:#26392f;
  --surface:#122019; --surface-2:#1a2b22; --spruce:#1d6a4d; --spruce-ink:#8bd0aa; --on-spruce:#f3f8f2;
  --gold:#f2b421; --gold-ink:#f2c24f; --track:#26382e; --shadow:0,0,0; --scrim:rgba(0,0,0,.56);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{height:100%;box-sizing:border-box}
body{height:100%;margin:0;overflow:hidden;font-family:var(--font);color:var(--ink);
  background:radial-gradient(ellipse 75% 58% at 50% 46%, var(--bg-hi), var(--bg) 72%) var(--bg);
  -webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--spruce-ink);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- shell ---------- */
.app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;padding-inline:16px;max-width:1100px;margin:0 auto}
.top{display:flex;align-items:center;gap:8px;padding-block:12px 2px}
.brand{flex:1;min-width:0}
.brand h1{margin:0;font-size:17px;font-weight:700;letter-spacing:-.01em;line-height:1.2}
.brand p{margin:2px 0 0;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);
  background:color-mix(in srgb, var(--surface) 55%, transparent);transition:background .2s, transform .15s}
.iconbtn:hover{background:var(--surface-2)}
.iconbtn:active{transform:scale(.94)}
.iconbtn svg{width:20px;height:20px}
.ring{position:relative}
.ring svg{width:34px;height:34px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:3}
.ring .trk{stroke:var(--track)}
.ring .arc{stroke:var(--gold);stroke-linecap:round;transition:stroke-dasharray .6s cubic-bezier(.2,.8,.2,1)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:11px;font-weight:700;font-variant-numeric:tabular-nums}

/* ---------- deck ---------- */
.stage{position:relative;min-height:0;container-type:size;display:grid;place-items:center;touch-action:pan-y;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.float{animation:bob 6.5s ease-in-out infinite alternate}
@keyframes bob{from{transform:translateY(2px)}to{transform:translateY(-7px)}}
.stage.dragging .float,.stage.holding .float,.stage.riffling .float{animation-play-state:paused}
.deck{position:relative;width:min(100cqw - 10px, (100cqh - 58px) * .7143, 470px);aspect-ratio:1060/1484;margin-top:-16px;
  transition:transform .3s ease-out}
.card{position:absolute;inset:0;transform-origin:50% 88%;will-change:transform;perspective:1800px;container-type:inline-size;
  transition:transform var(--dur,.46s) cubic-bezier(.2,.75,.2,1), opacity var(--dur,.35s) ease}
.card.no-anim,.stage.dragging .card{transition:none}
.stage.riffling .card{transition-timing-function:cubic-bezier(.25,.6,.3,1), ease}
.card.is-top .front{touch-action:none;cursor:grab}
.card.held .front{cursor:grabbing}
.card.held .face{box-shadow:0 1cqw 2cqw rgba(var(--shadow),.18), 0 12cqw 22cqw -4cqw rgba(var(--shadow),.55)}
.card:not(.is-top){pointer-events:none}
.card .inner{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .62s cubic-bezier(.3,.7,.15,1)}
.card.flipped .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:5.07cqw;-webkit-backface-visibility:hidden;backface-visibility:hidden;
  box-shadow:0 .4cqw 1.2cqw rgba(var(--shadow),.16), 0 5cqw 11cqw -3cqw rgba(var(--shadow),.42)}
.front{background-image:var(--cardsprite);background-size:1000% calc(var(--rows, 10) * 100%)}
.front img{display:block;width:100%;height:100%;border-radius:inherit;pointer-events:none;-webkit-user-drag:none}
.card:not(.is-top) .face{box-shadow:0 .3cqw 1cqw rgba(var(--shadow),.14), 0 3cqw 7cqw -3cqw rgba(var(--shadow),.3)}

/* pen marks on the printed SETT field */
.tick{position:absolute;overflow:visible;pointer-events:none}
.tick path{fill:none;stroke:var(--pen);stroke-width:8.5;stroke-linecap:round;stroke-linejoin:round;
  stroke-dasharray:1;stroke-dashoffset:1;opacity:0;transition:stroke-dashoffset .38s cubic-bezier(.5,0,.3,1), opacity 0s linear .38s}
.seen .tick path{stroke-dashoffset:0;opacity:1;transition:stroke-dashoffset .38s cubic-bezier(.5,0,.3,1), opacity 0s}
.sett-hit{position:absolute;background:none;border:0;border-radius:2cqw;padding:0}
.dato{position:absolute;display:block;cursor:pointer}
.dato input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:16px;border:0;margin:0;padding:0;-webkit-appearance:none;appearance:none}
.hand{position:absolute;bottom:22%;font-family:var(--hand);font-weight:600;font-size:7cqw;line-height:1;color:var(--pen);
  white-space:nowrap;transform:rotate(-2.5deg);transform-origin:0 100%;pointer-events:none;
  clip-path:inset(-30% 100% -30% 0);transition:clip-path .55s steps(14, end) .12s}
.seen .hand{clip-path:inset(-30% -10% -30% 0)}
.dato:focus-within{outline:2px solid var(--pen);outline-offset:1px;border-radius:1.5cqw}
/* "× 7": how many days the bird has been seen, written by the SETT label */
.antall{position:absolute;display:flex;align-items:center;font-family:var(--hand);font-weight:600;font-size:6.8cqw;line-height:1;
  color:var(--pen);white-space:nowrap;transform:rotate(-4deg);pointer-events:none}
.antall.pop{animation:pop .55s cubic-bezier(.3,1.7,.5,1)}
@keyframes pop{from{transform:rotate(-14deg) scale(.3);opacity:0}to{transform:rotate(-4deg) scale(1);opacity:1}}

/* back of the card: the days this bird was seen, on a note over the deck's back */
.logg{position:absolute;left:6.5%;right:6.5%;top:32%;bottom:5%;display:flex;flex-direction:column;overflow:hidden;
  background:color-mix(in srgb, var(--card-cream) 96%, transparent);color:var(--card-ink);border-radius:3.6cqw;
  border:.35cqw solid rgba(20,35,29,.14);box-shadow:0 1.2cqw 5cqw -1cqw rgba(20,35,29,.4)}
.logg[hidden]{display:none}
.lh{display:grid;gap:.8cqw;padding:4.2cqw 5cqw 3cqw;border-bottom:.35cqw solid #e6e3cf}
.lh b{font-size:6.6cqw;font-weight:700;letter-spacing:-.015em;line-height:1.05}
.lh span{font-size:3.9cqw;color:#4c5c54}
.llist{list-style:none;margin:0;padding:.5cqw 2.5cqw .5cqw 5cqw;flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y}
.llist li{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:3.4cqw;min-height:12.5cqw;border-bottom:.3cqw dashed #dcd8c2}
.llist li:last-child{border-bottom:0}
.ld{font-family:var(--hand);font-weight:600;font-size:7.4cqw;line-height:1;color:var(--pen);transform:rotate(-2deg)}
.lw{font-size:3.6cqw;line-height:1.25;color:#56665e}
.lw b{font-weight:700;color:var(--card-green)}
.ldel{width:10.5cqw;height:10.5cqw;padding:0;border:0;border-radius:50%;background:none;display:grid;place-items:center;color:#6d7a72}
.ldel svg{width:4.2cqw;height:4.2cqw}
.ldel:hover{background:rgba(20,35,29,.07)}
.ladd{position:relative;display:flex;align-items:center;justify-content:center;margin:2.4cqw 4cqw 4cqw;min-height:12cqw;border-radius:2.8cqw;
  background:var(--card-green);color:#f3f8f2;font-weight:600;font-size:4.3cqw;cursor:pointer}
.ladd input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:16px;border:0;margin:0;padding:0;-webkit-appearance:none;appearance:none}
.ladd:focus-within{outline:2px solid var(--pen);outline-offset:2px}

/* back of the card: readable field notes */
.stars{display:inline-flex;gap:.2em;color:var(--card-gold)}
.stars svg{width:1em;height:1em;fill:currentColor}

/* back of the card: the deck's own back (cards/bakside.webp from Fuglekort-) */
.back{transform:rotateY(180deg)}
.back img{display:block;width:100%;height:100%;border-radius:inherit;pointer-events:none;-webkit-user-drag:none}
.card.is-top .back{touch-action:none}
.card:not(.flipped) .back,.card.flipped .front{pointer-events:none}

/* desktop arrows */
.nav{position:absolute;top:50%;width:46px;height:46px;margin-top:-41px;border-radius:50%;border:1px solid var(--line);display:none;place-items:center;
  background:color-mix(in srgb, var(--surface) 70%, transparent);z-index:20}
.nav svg{width:22px;height:22px}
.nav:hover{background:var(--surface-2)}
.nav.prev{left:max(0px, calc(50% - var(--dw, 300px)/2 - 86px))}
.nav.next{right:max(0px, calc(50% - var(--dw, 300px)/2 - 86px))}
@media (hover:hover) and (pointer:fine){.nav{display:grid}}
@container (max-width: 640px){.nav{display:none}}

/* the edges light up while a card is held; reach one and let go to change card */
.edge{position:absolute;top:14%;bottom:14%;width:5px;border-radius:5px;pointer-events:none;z-index:30;opacity:0;
  background:linear-gradient(transparent, var(--gold) 30%, var(--gold) 70%, transparent);transition:opacity .2s, width .2s, box-shadow .2s}
.edge.l{left:-11px}
.edge.r{right:-11px}
.stage.dragging .edge{opacity:.3}
.stage.dragging .edge.armed{opacity:1;width:8px;box-shadow:0 0 22px 6px color-mix(in srgb, var(--gold) 50%, transparent)}

/* ---------- scrubber ---------- */
.bottom{padding-block:4px 14px;display:grid;gap:8px;justify-items:center}
.scrub{position:relative;width:100%;max-width:560px;height:34px;display:grid;grid-template-columns:repeat(60,1fr);gap:1px;align-items:end;
  touch-action:none;cursor:pointer;padding-inline:2px}
.scrub i{display:block;height:9px;border-radius:2px;background:var(--track);transition:height .25s, background .25s}
.scrub i.x10{height:13px}
.scrub i.s{background:var(--gold);height:16px}
.scrub i.c{background:var(--ink);height:26px}
.hint{margin:0;font-size:12.5px;color:var(--muted);transition:opacity .4s}
.hint.gone{opacity:0}

/* ---------- sheets ---------- */
.scrim{position:fixed;inset:0;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity .3s;z-index:40}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;z-index:50;background:var(--surface);color:var(--ink);visibility:hidden;
  transition:transform .38s cubic-bezier(.2,.8,.2,1), visibility 0s .38s;box-shadow:0 20px 60px -20px rgba(var(--shadow),.55)}
.sheet.on{visibility:visible;transition:transform .38s cubic-bezier(.2,.8,.2,1)}
.search{top:0;left:50%;width:min(640px,100%);max-height:88%;border-radius:0 0 22px 22px;transform:translate(-50%,-105%);
  display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 14px) 16px 10px}
.search.on{transform:translate(-50%,0)}
.qrow{display:flex;gap:8px;align-items:center}
.qbox{flex:1;position:relative}
.qbox svg{position:absolute;left:14px;top:50%;width:18px;height:18px;margin-top:-9px;color:var(--muted);pointer-events:none}
.qbox input{width:100%;height:48px;border-radius:14px;border:1px solid var(--line);background:var(--bg-hi);padding:0 14px 0 42px;font-size:17px;outline:none}
.qbox input:focus{border-color:var(--spruce-ink);box-shadow:0 0 0 3px color-mix(in srgb, var(--spruce-ink) 22%, transparent)}
.textbtn{border:0;background:none;padding:10px 6px;font-weight:600;color:var(--spruce-ink)}
.chips{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;align-items:center}
.chip{border:1px solid var(--line);background:none;border-radius:999px;padding:6px 12px;font-size:13.5px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--spruce);border-color:var(--spruce);color:var(--on-spruce)}
.count{margin-left:auto;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.results{list-style:none;margin:10px -16px 0;padding:0 8px 6px;overflow-y:auto;overscroll-behavior:contain;min-height:0}
.res{width:100%;display:grid;grid-template-columns:48px 1fr auto;gap:12px;align-items:center;text-align:left;border:0;background:none;padding:8px;border-radius:14px}
.res:hover,.res:focus-visible{background:var(--surface-2)}
.ph{width:48px;height:48px;border-radius:12px;background-image:var(--photos);background-size:1000% calc(var(--rows, 10) * 100%);background-color:var(--track)}
.res .t{min-width:0}
.res .n{display:block;font-weight:600;font-size:16px;line-height:1.2}
.res .l{display:block;font-size:12.5px;font-style:italic;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.res .sn{display:block;font-size:13px;color:var(--muted);margin-top:2px;line-height:1.3;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.res .sn em{font-style:normal;font-weight:600;color:var(--ink)}
.res mark{background:color-mix(in srgb, var(--gold) 38%, transparent);color:inherit;border-radius:3px;padding:0 1px}
.res .r{display:grid;justify-items:end;gap:4px;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.res .stars{font-size:11px;color:var(--gold)}
.okdot{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--gold);color:#1b1402}
.okdot svg{width:12px;height:12px}
.empty{padding:28px 8px;text-align:center;color:var(--muted);font-size:14px}

.stats{top:0;right:0;bottom:0;width:min(440px,100%);transform:translateX(105%);overflow-y:auto;overscroll-behavior:contain;
  padding:calc(env(safe-area-inset-top,0px) + 14px) 20px calc(env(safe-area-inset-bottom,0px) + 28px)}
.stats.on{transform:translateX(0)}
.s-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.s-head h2{margin:0;font-size:20px;letter-spacing:-.01em}
.s-sec{margin-top:26px}
.s-sec h3{margin:0 0 12px;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.hero{display:flex;align-items:baseline;gap:10px;margin-top:18px}
.hero .big{font-size:64px;font-weight:700;line-height:.9;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.hero .of{font-size:17px;color:var(--muted)}
.bar{height:10px;border-radius:5px;background:var(--track);overflow:hidden;margin-top:14px}
.bar i{display:block;height:100%;border-radius:5px;background:var(--gold);transition:width .6s cubic-bezier(.2,.8,.2,1)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.kpi{border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.kpi b{display:block;font-size:22px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.kpi span{font-size:12.5px;color:var(--muted);line-height:1.35;display:block;margin-top:2px}
.rar{display:grid;gap:12px}
.rrow{display:grid;grid-template-columns:78px 1fr 44px;gap:10px;align-items:center;font-size:14px}
.rrow .stars{font-size:13px;color:var(--gold)}
.rrow .lab{display:grid;gap:5px}
.rrow .lab span{font-size:13px}
.rrow .bar{margin:0;height:7px}
.rrow .num{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
.months{position:relative;display:grid;grid-template-columns:repeat(12,1fr);gap:4px;align-items:end;height:120px;padding-top:18px;border-bottom:1px solid var(--line)}
.mcol{position:relative;height:100%;display:flex;align-items:flex-end;justify-content:center;border:0;background:none;padding:0}
.mcol i{display:block;width:100%;max-width:22px;min-height:0;border-radius:4px 4px 0 0;background:var(--gold)}
.mcol.zero i{height:2px!important;background:var(--track);border-radius:1px}
.mcol .v{position:absolute;bottom:calc(var(--h) + 3px);left:0;right:0;text-align:center;font-size:11px;font-weight:600;font-variant-numeric:tabular-nums}
.mlabels{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;margin-top:6px;font-size:10.5px;color:var(--muted);text-align:center}
.tip{position:absolute;z-index:3;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;padding:5px 8px;border-radius:7px;white-space:nowrap;transform:translate(-50%,-100%);opacity:0;transition:opacity .15s}
.tip.on{opacity:1}
.cap{font-size:12.5px;color:var(--muted);margin:10px 0 0}
.recent{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.recent button{width:100%;display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;border:0;background:none;padding:6px;border-radius:12px;text-align:left}
.recent button:hover{background:var(--surface-2)}
.recent .ph{width:40px;height:40px;border-radius:10px}
.recent .d{font-family:var(--hand);font-size:20px;color:var(--spruce-ink);font-weight:600;white-space:nowrap}
.album{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}
.alb{position:relative;border:0;padding:0;background:none;aspect-ratio:150/210;border-radius:5px}
.alb .th{position:absolute;inset:0;border-radius:5px;background-image:var(--cardsprite);background-size:1000% calc(var(--rows, 10) * 100%);filter:grayscale(1);opacity:.35;transition:filter .3s, opacity .3s}
.alb.s .th{filter:none;opacity:1;box-shadow:0 3px 8px -3px rgba(var(--shadow),.5)}
.alb .nr{position:absolute;inset:0;display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.alb.s .nr{display:none}
.alb .okdot{position:absolute;right:-4px;top:-4px;width:17px;height:17px;display:none}
.alb.s .okdot{display:grid}
.alb .okdot svg{width:10px;height:10px}
.store{font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:center}
.store i{width:8px;height:8px;border-radius:50%;background:var(--muted);flex-shrink:0}
.store.sky i{background:#3aa66f}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btn{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:9px 12px;font-size:13.5px;font-weight:600}
.btn.pri{background:var(--spruce);border-color:var(--spruce);color:var(--on-spruce)}
.restore{margin-top:10px;display:grid;gap:8px}
.restore textarea{width:100%;min-height:90px;border-radius:10px;border:1px solid var(--line);background:var(--bg-hi);padding:10px;font-size:13px;font-family:ui-monospace,Menlo,monospace}

.iconbtn.qmark{font-size:19px;font-weight:700;line-height:1}
/* innstillinger: valg av bildesett */
.valg{display:grid;gap:10px}
.valg button{display:grid;grid-template-columns:22px 1fr;gap:4px 12px;align-items:start;text-align:left;width:100%;
  border:1px solid var(--line);background:var(--surface-2);border-radius:14px;padding:14px;color:var(--ink)}
.valg button .rd{grid-row:span 2;width:22px;height:22px;border-radius:50%;border:2px solid var(--line);margin-top:1px;display:grid;place-items:center}
.valg button[aria-checked="true"]{border-color:var(--spruce-ink);background:color-mix(in srgb, var(--spruce-ink) 9%, var(--surface))}
.valg button[aria-checked="true"] .rd{border-color:var(--spruce-ink)}
.valg button[aria-checked="true"] .rd::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--spruce-ink)}

<script type="application/json" id="kortdata">__CARDS_JSON__</script>
<script>
(() => {
'use strict';
const DATA = JSON.parse(document.getElementById('kortdata').textContent);
const CARDS = DATA.kort;
const N = CARDS.length;
const RAR = DATA.sjeldenhet;
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const mod = n => ((n % N) + N) % N;
const pad3 = n => String(n).padStart(3, '0');
const STAR = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.6l2.85 6 6.55.78-4.84 4.5 1.3 6.5L12 17.2l-5.86 3.18 1.3-6.5L2.6 9.38l6.55-.78z"/></svg>';
const stars = n => `<span class="stars" aria-label="${n} av 5 stjerner">${STAR.repeat(n)}</span>`;
const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>';
const PEN = '<path pathLength="1" d="M18 58 C 24 64, 31 73, 37 86 C 49 60, 65 33, 94 7"/>';
const MND = ['jan','feb','mar','apr','mai','jun','jul','aug','sep','okt','nov','des'];
const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
const todayISO = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
const fmtHand = iso => { if (!iso) return ''; const [y,m,d] = iso.split('-'); return `${d}.${m}.${y}`; };
const fmtLong = iso => { if (!iso) return ''; const [y,m,d] = iso.split('-').map(Number); return `${d}. ${MND[m-1]}. ${y}`; };
/* Bildesett: KI-illustrasjoner (standard) eller fotografier fra Artsdatabanken der de finnes */
const HAR_FOTO = Array.isArray(DATA.hjelpFoto) && CARDS.some(c => c.bildeFoto);
let bildevalg = HAR_FOTO && lsGet('hagefugler:bilder') === 'foto' ? 'foto' : 'ki';
const foto = () => bildevalg === 'foto';
const bildeAv = c => (foto() && c.bildeFoto) || c.bilde;
function settSprites() {
  const f = foto() ? '-foto' : '';
  document.documentElement.style.setProperty('--photos', `url("sprites/photos${f}.webp")`);
  document.documentElement.style.setProperty('--cardsprite', `url("sprites/cards${f}.webp")`);
}
settSprites();
const ROWS = Math.ceil(N / 10);
document.documentElement.style.setProperty('--rows', ROWS);
const spritePos = i => `${(i % 10) / 9 * 100}% ${ROWS > 1 ? Math.floor(i / 10) / (ROWS - 1) * 100 : 0}%`;
const BACK = `<img src="${esc(DATA.bakside || 'cards/bakside.webp')}" alt="" draggable="false" decoding="async" loading="lazy">`;

/* ================= Storage =================
   One small adapter so the same page runs as a Claude artifact (shared db)
   and as a standalone app (localStorage). Swap `connectRemote` for your own
   backend when this becomes a separate app. */
/* One entry per species with every day it was seen, oldest first. `date` is the first day; it stays in the
   stored object so older versions of the app (which only knew one date) still read the list correctly. */
const ISO = /^\d{4}-\d{2}-\d{2}$/;
function entry(v) {
  if (!v) return null;
  const dager = [...new Set([...(Array.isArray(v.dager) ? v.dager : []), v.date].filter(d => typeof d === 'string' && ISO.test(d)))].sort();
  return dager.length ? { date: dager[0], dager, ts: v.ts || 0 } : null;
}
function entries(raw) {
  const out = {};
  Object.keys(raw || {}).forEach(k => { const e = entry(raw[k]); if (e) out[k] = e; });
  return out;
}
const Store = {
  KEY: 'hagefugler-oslo:sett:v1',
  data: {},             // "parus-major" -> { date: "2026-09-20", dager: ["2026-09-20", "2026-09-29"], ts: 1727… }
  mode: 'lokal',
  readOnly: false,
  db: null,
  subs: new Set(),
  queue: {},
  loadLocal() {
    let raw = {};
    try { raw = JSON.parse(lsGet(this.KEY) || '{}') || {}; } catch (e) { raw = {}; }
    this.data = entries(raw);
    migrateKeys(this.data);
    this.saveLocal();
  },
  saveLocal() { lsSet(this.KEY, JSON.stringify(this.data)); },
  emit() { this.subs.forEach(fn => fn()); },
  on(fn) { this.subs.add(fn); },
  has(id) { return !!this.data[id]; },
  get(id) { return this.data[id]; },
  days(id) { return this.data[id] ? this.data[id].dager : []; },
  /* the whole list of days for one species; an empty list removes it */
  put(id, dager) {
    const e = entry({ dager });
    if (e) { e.ts = Date.now(); this.data[id] = e; } else delete this.data[id];
    this.saveLocal(); this.emit(); this.push(id);
  },
  addDay(id, d) { const cur = this.days(id); if (cur.includes(d)) return false; this.put(id, [...cur, d]); return true; },
  removeDay(id, d) { this.put(id, this.days(id).filter(x => x !== d)); },
  async connectRemote() {
    const c = window.claude;
    if (!c || typeof c.use !== 'function') return;
    let db = null;
    try { db = await c.use('db'); } catch (e) { db = null; }
    if (!db) return;
    this.db = db;
    let settled = false;
    db.collection('sett').onSnapshot(snap => {
      const next = {};
      snap.docs.forEach(d => { if (d.exists) { const e = entry(d.data()); if (e) next[d.id] = e; } });
      const moved = migrateKeys(next);          // old documents named by card number → the species
      if (!settled && !snap.metadata.fromCache) {
        settled = true;
        // First real answer from an empty shared store: lift any sightings made on this device before.
        if (snap.empty) Object.keys(this.data).forEach(id => { next[id] = this.data[id]; this.push(id); });
      }
      Object.keys(this.queue).forEach(id => { if (this.queue[id].busy || this.queue[id].again) { if (this.data[id]) next[id] = this.data[id]; else delete next[id]; } });
      this.data = next;
      this.mode = 'delt';
      this.saveLocal();
      this.emit();
      moved.forEach(([oldId, key]) => { this.push(key); this.push(oldId); });
    }, () => { this.mode = 'lokal'; this.emit(); });
  },
  replaceAll(obj) { const prev = Object.keys(this.data); this.data = obj; this.saveLocal(); this.emit(); new Set([...prev, ...Object.keys(obj)]).forEach(id => this.push(id)); },
  push(id) {
    if (!this.db || this.readOnly) return;
    const q = this.queue[id] || (this.queue[id] = { busy: false, again: false });
    if (q.busy) { q.again = true; return; }
    q.busy = true;
    const run = async () => {
      let tries = 0;
      for (;;) {
        q.again = false;
        const v = this.data[id];
        try {
          const ref = this.db.doc('sett/' + id);
          if (v) await ref.set({ art: id, date: v.date, dager: v.dager, ts: v.ts }); else await ref.delete();
        } catch (e) {
          if (e && (e.code === 'invalid_argument' || e.code === 'not_granted' || e.code === 'revoked')) {
            this.readOnly = true; this.mode = 'lokal'; this.emit();
            toast('Denne visningen kan ikke lagre i den delte lista. Avkrysningen ligger bare på denne enheten.');
            break;
          }
          if (tries++ < 1) { await new Promise(r => setTimeout(r, 900 + Math.random() * 900)); q.again = true; }
          else { toast('Fikk ikke lagret akkurat nå. Endringen ligger på denne enheten.'); }
        }
        if (!q.again) break;
      }
      q.busy = false;
    };
    run();
  }
};
/* Sightings are keyed by species (c.key, e.g. "parus-major"), so they survive a new card order.
   Older versions keyed them by card number; move those over once, using the old numbering. */
const BY_KEY = Object.fromEntries(CARDS.map((c, i) => [c.key, i]));
const OLD_NR = DATA.tidligereNr || {};
function migrateKeys(obj) {
  const moved = [];
  Object.keys(obj).forEach(k => {
    if (!/^\d{3}$/.test(k)) return;
    const key = OLD_NR[k];
    if (key && BY_KEY[key] != null) obj[key] = obj[key] ? entry({ dager: [...obj[key].dager, ...obj[k].dager], ts: obj[key].ts }) : obj[k];
    delete obj[k];
    moved.push([k, key]);
  });
  return moved.filter(([, key]) => key);
}
const seenCount = () => Object.keys(Store.data).filter(k => BY_KEY[k] != null).length;
Store.loadLocal();

/* ================= Search index ================= */
function norm(s) {
  let out = ''; const map = [];
  for (let i = 0; i < s.length; i++) {
    const ch = s[i].toLowerCase();
    let rep = ch === 'æ' ? 'ae' : ch === 'ø' ? 'o' : ch === 'å' ? 'a' : /[–—]/.test(ch) ? '-' : ch.normalize('NFD').replace(/[̀-ͯ]/g, '');
    for (const r of rep) { out += r; map.push(i); }
  }
  return { s: out, map };
}
const FIELDS = [['navn', 'Navn', 100], ['latin', 'Latin', 40], ['kjennetegn', 'Kjennetegn', 30], ['fakta', 'Fun fact', 12], ['mat', 'Mat', 12],
  ['nar', 'Når', 8], ['status', 'Status', 8], ['utbredelse', 'Utbredelse', 3]];
const IDX = CARDS.map(c => Object.fromEntries(FIELDS.map(([k]) => [k, norm(c[k])])));

/* ================= Deck ================= */
const stage = $('#stage'), deckEl = $('#deck');
let cur = Math.min(N - 1, Math.max(0, parseInt(lsGet('hagefugler-oslo:kort') || '0', 10) || 0));
const hashNr = /^#k?(\d{1,3})$/.exec(location.hash || '');
if (hashNr && +hashNr[1] >= 1 && +hashNr[1] <= N) cur = +hashNr[1] - 1;
const pool = new Map();

const altTekst = c => `Fuglekort ${c.id}: ${c.navn}, ${c.latin}. ${c.status}.${foto() && c.fotograf ? ` Foto: ${c.fotograf}.` : ''}`;
function makeCard(i) {
  const c = CARDS[i];
  const [bx, by, bw, bh] = c.sett.boks, [lx, ly, lw] = c.sett.linje;
  const P = v => (v * 100).toFixed(3) + '%';
  const dLeft = lx - 0.13, dW = lw + 0.15;
  const el = document.createElement('div');
  el.className = 'card';
  el.dataset.i = i;
  el.setAttribute('role', 'group');
  el.setAttribute('aria-label', `Kort ${c.id}: ${c.navn}`);
  el.innerHTML = `
  <div class="inner">
    <div class="face front" style="background-position:${spritePos(i)}">
      <img src="${esc(bildeAv(c))}" alt="${esc(altTekst(c))}" draggable="false" decoding="async">
      <svg class="tick" viewBox="0 0 100 100" aria-hidden="true" style="left:${P(bx - 0.012)};top:${P(by - bh * 0.45)};width:${P(bw * 1.55)};height:${P(bh * 1.5)}">${PEN}</svg>
      <button class="ctl sett-hit" data-act="toggle" aria-pressed="false" aria-label="Sett ${esc(c.navn)}" style="left:${P(bx - 0.025)};top:${P(by - 0.012)};width:${P(bw + 0.22)};height:${P(bh + 0.024)}"></button>
      <span class="antall" aria-hidden="true" style="left:${P(bx + bw + 0.14)};top:${P(by - 0.006)};height:${P(bh + 0.012)}"></span>
      <label class="ctl dato" style="left:${P(dLeft)};top:${P(ly - 0.052)};width:${P(dW)};height:${P(0.07)}">
        <span class="hand" style="left:${P((lx - dLeft + 0.012) / dW)}"></span>
        <input type="date" data-act="date" aria-label="Første gang du så ${esc(c.navn)}">
      </label>
    </div>
    <div class="face back">${BACK}<div class="logg" hidden></div></div>
  </div>`;
  el.querySelector('.back').inert = true;
  paintCard(el);
  return el;
}

const UKEDAG = ['søndag', 'mandag', 'tirsdag', 'onsdag', 'torsdag', 'fredag', 'lørdag'];
const ukedag = iso => { const [y, m, d] = iso.split('-').map(Number); return UKEDAG[new Date(y, m - 1, d).getDay()]; };
const dagerTekst = n => `${n} observasjonsdag${n === 1 ? '' : 'er'}`;
const XMARK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>';

function paintCard(el) {
  const c = CARDS[+el.dataset.i];
  const s = Store.get(c.key);
  const dager = s ? s.dager : [], t = todayISO();
  el.classList.toggle('seen', !!s);
  const b = el.querySelector('[data-act="toggle"]');
  b.setAttribute('aria-pressed', s ? 'true' : 'false');
  b.setAttribute('aria-label', !s ? `Merk ${c.navn} som sett i dag`
    : dager.includes(t) ? `${c.navn} er registrert i dag. Trykk for å se alle dagene`
    : `Registrer ${c.navn} som sett i dag. ${dagerTekst(dager.length)} så langt`);
  el.querySelector('.hand').textContent = s ? fmtHand(s.date) : '';
  // "× 7" by the SETT box once a bird has been seen on more than one day
  const ant = el.querySelector('.antall'), before = ant.dataset.n == null ? null : +ant.dataset.n;
  ant.dataset.n = dager.length;
  ant.textContent = dager.length > 1 ? `× ${dager.length}` : '';
  if (before != null && dager.length > before && dager.length > 1) { ant.classList.remove('pop'); void ant.offsetWidth; ant.classList.add('pop'); }
  const inp = el.querySelector('[data-act="date"]');
  inp.value = s ? s.date : ''; inp.max = t;
  paintLogg(el, c, dager);
}

/* the back of the card: every day this bird was seen, newest first */
function paintLogg(el, c, dager) {
  const box = el.querySelector('.logg'), t = todayISO();
  const sig = dager.join(',') + '|' + t;
  if (box.dataset.sig === sig) return;
  box.dataset.sig = sig;
  box.hidden = !dager.length;
  if (!dager.length) { box.innerHTML = ''; return; }
  const rows = [...dager].reverse().map(d => `<li><span class="ld">${fmtHand(d)}</span>
    <span class="lw">${d === t ? 'i dag' : ukedag(d)}${d === dager[0] ? '<br><b>første gang</b>' : ''}</span>
    <button class="ctl ldel" data-act="delday" data-d="${d}" aria-label="Slett ${fmtLong(d)}">${XMARK}</button></li>`).join('');
  box.innerHTML = `<div class="lh"><b>${esc(c.navn)}</b><span>${dagerTekst(dager.length)}</span></div>
    <ol class="b-body llist" aria-label="Dager du har sett ${esc(c.navn)}">${rows}</ol>
    <label class="ctl ladd"><span>+ Legg til en dag</span><input type="date" data-act="addday" max="${t}" aria-label="Legg til en dag du så ${esc(c.navn)}"></label>`;
}
function setFlipped(el, on) {
  el.classList.toggle('flipped', on);
  el.querySelector('.front').inert = on;
  el.querySelector('.back').inert = !on;
  if (on) { const l = el.querySelector('.llist'); if (l) l.scrollTop = 0; }
}

function metrics() {
  const W = deckEl.offsetWidth || 300, SW = stage.offsetWidth || 360;
  stage.style.setProperty('--dw', W + 'px');
  return { W, SW };
}
/* Slots: -2 and -1 lie off to the left (cards already passed), 0 is the top card,
   1–2 peek out below it, 3–4 wait invisibly at the bottom of the stack. */
const SLOTS = [-2, -1, 0, 1, 2, 3, 4];
function pose(slot, m) {
  const { W, SW } = m;
  const off = SW / 2 + W * 0.8;
  switch (slot) {
    case -2: return { x: -(off + W * 0.9), y: W * 0.1, r: -24, s: 1, o: 1, z: 11 };
    case -1: return { x: -off, y: W * 0.05, r: -15, s: 1, o: 1, z: 12 };
    case 0:  return { x: 0, y: 0, r: 0, s: 1, o: 1, z: 10 };
    case 1:  return { x: W * 0.012, y: W * 0.046, r: 2.6, s: 0.955, o: 1, z: 9 };
    case 2:  return { x: -W * 0.01, y: W * 0.088, r: -2.3, s: 0.91, o: 1, z: 8 };
    case 3:  return { x: 0, y: W * 0.115, r: 0.4, s: 0.87, o: 0, z: 7 };
    default: return { x: 0, y: W * 0.115, r: 0.4, s: 0.87, o: 0, z: 6 };
  }
}
const lerp = (a, b, t) => ({ x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t, r: a.r + (b.r - a.r) * t, s: a.s + (b.s - a.s) * t, o: a.o + (b.o - a.o) * t, z: t > .5 ? b.z : a.z });
function apply(el, p) {
  el.style.transform = `translate3d(${p.x.toFixed(1)}px,${p.y.toFixed(1)}px,0) rotate(${p.r.toFixed(2)}deg) scale(${p.s.toFixed(4)})`;
  el.style.opacity = p.o;
  el.style.zIndex = p.z;
}
function slotOf(i) { let d = mod(i - cur); if (d > N / 2) d -= N; return d >= -2 && d <= 4 ? d : null; }

function sync(opts = {}) {
  const m = metrics();
  const need = SLOTS.map(d => mod(cur + d));
  for (const [i, el] of pool) if (!need.includes(i)) { el.remove(); pool.delete(i); }
  const fresh = [];
  need.forEach(i => {
    if (!pool.has(i)) {
      const el = makeCard(i);
      el.classList.add('no-anim');
      const p = pose(slotOf(i), m);
      if (opts.deal && slotOf(i) >= 0) apply(el, { ...p, y: p.y - m.W * 0.18, o: 0, r: p.r - 4 }); else apply(el, p);
      deckEl.appendChild(el);
      pool.set(i, el);
      fresh.push(el);
    }
  });
  if (fresh.length) void deckEl.offsetWidth;
  fresh.forEach(el => el.classList.remove('no-anim'));
  if (opts.instant) pool.forEach(el => el.classList.add('no-anim'));
  pool.forEach((el, i) => {
    const s = slotOf(i);
    el.classList.toggle('is-top', s === 0);
    el.classList.remove('held');
    if (s !== 0 && el.classList.contains('flipped')) setFlipped(el, false);
    el.setAttribute('aria-hidden', s === 0 ? 'false' : 'true');
    el.inert = s !== 0;
    apply(el, pose(s, m));
  });
  if (opts.instant) { void deckEl.offsetWidth; pool.forEach(el => el.classList.remove('no-anim')); }
  lsSet('hagefugler-oslo:kort', String(cur));
  paintChrome();
}

function go(dir, quiet) { cur = mod(cur + dir); sync(); if (!quiet) { announce(); nudgeHint(); } }
function jump(i, how = 'deal') {
  stopRiffle();
  if (i === cur) { sync(); return; }
  if (how !== 'instant' && Math.abs(i - cur) === 1) { go(i - cur); return; }
  cur = i;
  if (how === 'instant') { sync({ instant: true }); }
  else { pool.forEach(el => el.remove()); pool.clear(); sync({ deal: true }); }
  announce();
}
function flip() {
  const el = pool.get(cur); if (!el) return;
  setFlipped(el, !el.classList.contains('flipped'));
  nudgeHint();
}
function announce() { const c = CARDS[cur]; $('#live').textContent = `Kort ${cur + 1} av ${N}: ${c.navn}${Store.has(c.key) ? ', sett' : ''}`; }
const haptic = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} };

/* ---- momentum: a fast swipe riffles through many cards, slowing down; a tap stops it ---- */
let riffle = null;
function startRiffle(dir, count) {
  stopRiffle();
  riffle = { dir, n: count, left: count, t: 0 };
  stage.classList.add('riffling');
  const step = () => {
    if (!riffle) return;
    const k = 1 - riffle.left / riffle.n;                 // 0 → 1 over the riffle
    const gap = 55 + 320 * k * k;                          // time until the next card
    stage.style.setProperty('--dur', Math.round(Math.min(460, Math.max(170, gap * 1.8))) + 'ms');
    go(riffle.dir, true);
    if (--riffle.left <= 0) { riffle.t = setTimeout(() => stopRiffle(), 420); return; }
    riffle.t = setTimeout(step, gap);
  };
  step();
}
function stopRiffle() {
  if (!riffle) return false;
  clearTimeout(riffle.t);
  riffle = null;
  stage.classList.remove('riffling');
  stage.style.removeProperty('--dur');
  announce();
  return true;
}

/* ---- hold, drag, reach the edge, let go ---- */
// Tuning: a swipe starts a multi-card scroll only if it is both long and fast.
const FLING = {
  minSpeed: 1.8,        // px per ms over the last ~100 ms of the swipe
  minDistance: 0.45,    // share of the card width the finger must travel (at least 140 px)
  cardsPerSpeed: 8,     // how many extra cards per px/ms above minSpeed
  maxCards: 30,
  swipeSpeed: 0.4,      // a slower swipe of 45 px or more still moves one card
};
const edgeL = $('#edgeL'), edgeR = $('#edgeR');
let drag = null;
function lift() {
  if (!drag || drag.held) return;
  const el = pool.get(cur); if (!el) return;
  drag.held = true;
  el.classList.add('held');
  stage.classList.add('holding');
  if (!drag.moved) apply(el, { x: 0, y: -drag.m.W * 0.012, r: 0, s: 1.035, o: 1, z: 13 });
  haptic(6);
}
function setArmed(a) {
  if (!drag || drag.armed === a) return;
  drag.armed = a;
  edgeL.classList.toggle('armed', a === 1);
  edgeR.classList.toggle('armed', a === -1);
  if (a) haptic(14);
}
stage.addEventListener('pointerdown', e => {
  // controls on the card take taps, not drags; the delete buttons in the list of days sit where a swipe
  // often starts, so a drag may begin on them (a tap on them still only deletes)
  if (e.button !== 0 || e.target.closest('.ctl:not(.ldel)')) return;
  const stopped = stopRiffle();                           // a touch while riffling stops it
  if (stopped) sync();
  const top = pool.get(cur);
  const onCard = !!e.target.closest('.card.is-top');
  const r = top ? top.getBoundingClientRect() : { top: 0, height: 0 };
  const now = performance.now();
  drag = { id: e.pointerId, x0: e.clientX, y0: e.clientY, t0: now, dx: 0, dy: 0, moved: false, held: false, armed: 0,
           stopped, onCard, upper: e.clientY < r.top + r.height / 2, inBody: !!e.target.closest('.b-body'), ctl: !!e.target.closest('.ctl'),
           hist: [[e.clientX, e.timeStamp || now]], m: metrics(), sr: stage.getBoundingClientRect() };
  if (onCard) drag.holdT = setTimeout(lift, 120);
});
stage.addEventListener('pointermove', e => {
  if (!drag || e.pointerId !== drag.id) return;
  drag.dx = e.clientX - drag.x0; drag.dy = e.clientY - drag.y0;
  const now = e.timeStamp || performance.now();
  drag.hist.push([e.clientX, now]);
  while (drag.hist.length > 2 && now - drag.hist[0][1] > 100) drag.hist.shift();
  if (!drag.moved) {
    if (Math.hypot(drag.dx, drag.dy) < 7) return;
    // on the back of the card, an upward/downward drag scrolls the text
    if ((drag.inBody || !drag.onCard) && Math.abs(drag.dy) > Math.abs(drag.dx)) { cancelDrag(); return; }
    drag.moved = true;
    try { stage.setPointerCapture(drag.id); } catch (err) {}
    stage.classList.add('dragging');
    lift();
  }
  e.preventDefault();
  const fx = e.clientX - drag.sr.left, SW = drag.sr.width, W = drag.m.W;
  let armed = 0;
  if ((fx < SW * 0.15 && drag.dx < -40) || drag.dx < -W * 0.62) armed = 1;
  else if ((fx > SW * 0.85 && drag.dx > 40) || drag.dx > W * 0.62) armed = -1;
  setArmed(armed);
  renderDrag(drag);
});
function renderDrag(d) {
  const m = d.m, W = m.W, dx = d.dx, dy = d.dy;
  const get = k => pool.get(mod(cur + k));
  // the held card follows the finger, tilting like a card pinched at the top or bottom
  get(0) && apply(get(0), { x: dx, y: dy, r: dx / W * 15 * (d.upper ? 1 : -1), s: 1.035, o: 1, z: 13 });
  if (dx <= 0) {
    const t = Math.min(1, -dx / (W * 0.75));
    [1, 2, 3].forEach(k => get(k) && apply(get(k), lerp(pose(k, m), pose(k - 1, m), t)));
    get(-1) && apply(get(-1), pose(-1, m));
  } else {
    const t = Math.min(1, dx / (W * 0.75));
    [1, 2, 3].forEach(k => get(k) && apply(get(k), pose(k, m)));
    const pv = pose(-1, m);                               // the previous card peeks in from the left
    get(-1) && apply(get(-1), { ...pv, x: pv.x * (1 - 0.42 * t), r: pv.r * (1 - 0.4 * t) });
  }
}
function clearDragUi() {
  stage.classList.remove('dragging', 'holding');
  edgeL.classList.remove('armed'); edgeR.classList.remove('armed');

}
function cancelDrag() { if (!drag) return; clearTimeout(drag.holdT); drag = null; clearDragUi(); sync(); }
function endDrag(e, cancelled) {
  if (!drag || (e && e.pointerId !== drag.id)) return;
  const d = drag; drag = null;
  clearTimeout(d.holdT);
  clearDragUi();
  if (!d.moved) {
    const quick = performance.now() - d.t0 < 450;
    if (!cancelled && !d.stopped && d.onCard && quick && !d.ctl) { sync(); flip(); } else sync();
    return;
  }
  const h = d.hist, a = h[0], b = h[h.length - 1];
  const vx = (b[0] - a[0]) / Math.max(8, b[1] - a[1]);    // px per ms over the last ~100 ms
  const fast = Math.abs(vx);
  if (cancelled) { sync(); return; }
  const longEnough = Math.abs(d.dx) >= Math.max(140, d.m.W * FLING.minDistance);
  if (fast >= FLING.minSpeed && longEnough) {
    const count = Math.max(3, Math.min(FLING.maxCards, Math.round(3 + (fast - FLING.minSpeed) * FLING.cardsPerSpeed)));
    startRiffle(vx < 0 ? 1 : -1, count);
  } else if (d.armed) {
    go(d.armed);
  } else if (fast > FLING.swipeSpeed && Math.abs(d.dx) > 45) {
    go(vx < 0 ? 1 : -1);

    sync();                                               // not at the edge: the card settles back on the stack
  }
}
stage.addEventListener('pointerup', e => endDrag(e, false));
stage.addEventListener('pointercancel', e => endDrag(e, true));
stage.addEventListener('lostpointercapture', e => { if (e.target === stage && drag && drag.moved && e.pointerId === drag.id) endDrag(e, false); });

let wheelAcc = 0, wheelLock = 0;
stage.addEventListener('wheel', e => {
  if (Math.abs(e.deltaX) < Math.abs(e.deltaY) || e.target.closest('.b-body')) return;
  e.preventDefault();
  if (performance.now() < wheelLock) return;
  wheelAcc += e.deltaX;
  if (Math.abs(wheelAcc) > 70) { stopRiffle(); go(wheelAcc > 0 ? 1 : -1); wheelAcc = 0; wheelLock = performance.now() + 380; }
}, { passive: false });

/* hover tilt on desktop: the deck floats a little toward the pointer */
if (matchMedia('(hover:hover) and (pointer:fine)').matches && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
  stage.addEventListener('pointermove', e => {
    if ((drag && drag.moved) || riffle) { deckEl.style.transform = ''; return; }
    const r = deckEl.getBoundingClientRect();
    const px = (e.clientX - (r.left + r.width / 2)) / r.width, py = (e.clientY - (r.top + r.height / 2)) / r.height;
    if (Math.abs(px) > 1.2 || Math.abs(py) > 1) { deckEl.style.transform = ''; return; }
    deckEl.style.transform = `perspective(1400px) rotateY(${(px * 5).toFixed(2)}deg) rotateX(${(-py * 4).toFixed(2)}deg)`;
  });
  stage.addEventListener('pointerleave', () => { deckEl.style.transform = ''; });
}

/* controls on the card: the SETT box and date line on the front, the list of days on the back */
deckEl.addEventListener('click', e => {
  const b = e.target.closest('[data-act="toggle"], [data-act="delday"]'); if (!b) return;
  const el = b.closest('.card'); if (!el || !el.classList.contains('is-top')) return;
  e.stopPropagation();
  const c = CARDS[+el.dataset.i];
  if (b.dataset.act === 'toggle') trykkSett(c); else slettDag(c, b.dataset.d);
});
deckEl.addEventListener('click', e => {
  const inp = e.target.closest('input[type="date"]'); if (!inp) return;
  if (typeof inp.showPicker === 'function') { try { inp.showPicker(); } catch (err) {} }
});
deckEl.addEventListener('change', e => {
  const inp = e.target.closest('input[type="date"]'); if (!inp || !inp.value || !ISO.test(inp.value)) return;
  const c = CARDS[+inp.closest('.card').dataset.i], d = inp.value;
  if (d > todayISO()) { toast('Datoen kan ikke være fram i tid.'); paintCard(inp.closest('.card')); return; }
  if (inp.dataset.act === 'addday') { inp.value = ''; leggTilDag(c, d); }
  else flyttForsteDag(c, d);
});

/* Tapping SETT: the first time it ticks the box and writes the date; on a later day it adds that day.
   A second tap on the same day shows the list of days instead of removing anything. */
function trykkSett(c) {
  const t = todayISO(), dager = Store.days(c.key);
  if (!dager.length) { registrer(c, t); return; }
  if (dager.includes(t)) { visLogg(c); toast(`${c.navn} er allerede registrert i dag.`); return; }
  Store.addDay(c.key, t);
  haptic(10);
  toast(`${c.navn}: ${dager.length + 1}. observasjonsdag.`, 'Angre', () => Store.removeDay(c.key, t));
}
function registrer(c, d) {
  Store.put(c.key, [d]);
  haptic(12);
  const n = seenCount();
  const msg = n === N ? `Alle ${N} artene er sett. Hele kortstokken er komplett!`
    : c.stjerner >= 4 ? `${c.navn}! ${c.stjerner === 5 ? 'Svært sjelden' : 'Sjelden'} i Oslo-hager. ${n} av ${N} sett.`
    : `${c.navn} er sett for første gang. ${n} av ${N} arter.`;
  toast(msg, 'Angre', () => Store.put(c.key, []));
}
function leggTilDag(c, d) {
  const gml = Store.days(c.key);
  if (!gml.length) { registrer(c, d); return; }
  if (gml.includes(d)) { toast(`${fmtHand(d)} er allerede registrert for ${c.navn}.`); return; }
  Store.addDay(c.key, d);
  toast(`La til ${fmtHand(d)}. ${c.navn}: ${dagerTekst(gml.length + 1)}.`, 'Angre', () => Store.put(c.key, gml));
}
function slettDag(c, d) {
  const gml = Store.days(c.key);
  Store.removeDay(c.key, d);
  toast(gml.length === 1 ? `${c.navn} er ikke lenger merket som sett.` : `Slettet ${fmtHand(d)} for ${c.navn}.`, 'Angre', () => Store.put(c.key, gml));
}
/* the date line on the front is the first day: changing it moves that day */
function flyttForsteDag(c, d) {
  const gml = Store.days(c.key);
  if (!gml.length) { registrer(c, d); return; }
  if (gml[0] === d) return;
  Store.put(c.key, [...gml.slice(1), d]);
  toast(`Første gang flyttet fra ${fmtHand(gml[0])} til ${fmtHand(d)}.`, 'Angre', () => Store.put(c.key, gml));
}
function visLogg(c) {
  const i = BY_KEY[c.key];
  if (i !== cur) jump(i);
  const el = pool.get(cur);
  if (el && !el.classList.contains('flipped')) flip();
}

/* keyboard */
document.addEventListener('keydown', e => {
  if (e.target.closest('input, textarea')) { if (e.key === 'Escape') closeSheets(); return; }
  if (openSheet) { if (e.key === 'Escape') closeSheets(); return; }
  if (e.key === 'ArrowRight') { e.preventDefault(); stopRiffle(); go(1); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); stopRiffle(); go(-1); }
  else if (e.key === 'Escape') { stopRiffle(); }
  else if ((e.key === ' ' || e.key === 'Enter') && !e.target.closest('button')) { e.preventDefault(); flip(); }
  else if (e.key === '/' || (e.key === 'k' && (e.metaKey || e.ctrlKey))) { e.preventDefault(); openSearch(); }
  else if (e.key === '?') { e.preventDefault(); openHelp(); }
  else if (e.key.toLowerCase() === 's' && !e.metaKey && !e.ctrlKey) { trykkSett(CARDS[cur]); }
});
$('#prevBtn').addEventListener('click', () => { stopRiffle(); go(-1); });
$('#nextBtn').addEventListener('click', () => { stopRiffle(); go(1); });

/* ---- scrubber ---- */
const scrub = $('#scrub');
scrub.style.gridTemplateColumns = `repeat(${N}, 1fr)`;
scrub.setAttribute('aria-valuemax', N);
scrub.innerHTML = CARDS.map((c, i) => `<i class="${(i + 1) % 10 === 0 ? 'x10' : ''}"></i>`).join('');
const ticks = [...scrub.children];
const scrubIndex = e => { const r = scrub.getBoundingClientRect(); return Math.max(0, Math.min(N - 1, Math.floor((e.clientX - r.left) / r.width * N))); };
let scrubbing = false;
scrub.addEventListener('pointerdown', e => { stopRiffle(); scrubbing = true; try { scrub.setPointerCapture(e.pointerId); } catch (err) {} jump(scrubIndex(e), 'instant'); });
scrub.addEventListener('pointermove', e => { if (scrubbing) { const i = scrubIndex(e); if (i !== cur) jump(i, 'instant'); } });
scrub.addEventListener('pointerup', () => { scrubbing = false; nudgeHint(); });
scrub.addEventListener('pointercancel', () => { scrubbing = false; });
scrub.addEventListener('keydown', e => {
  const map = { ArrowRight: 1, ArrowUp: 1, ArrowLeft: -1, ArrowDown: -1, PageUp: 10, PageDown: -10 };
  if (e.key in map) { e.preventDefault(); e.stopPropagation(); jump(Math.max(0, Math.min(N - 1, cur + map[e.key])), 'instant'); }
  else if (e.key === 'Home') { e.preventDefault(); jump(0, 'instant'); }
  else if (e.key === 'End') { e.preventDefault(); jump(N - 1, 'instant'); }
});

/* ---- header, ring, scrubber paint ---- */
function paintChrome() {
  const c = CARDS[cur];
  const n = seenCount();
  $('#sub').textContent = `Kort ${c.id} av ${pad3(N)} · ${n} sett`;
  $('#ringNum').textContent = n;
  const C = 2 * Math.PI * 14;
  $('#ringArc').setAttribute('stroke-dasharray', `${(n / N * C).toFixed(2)} ${C.toFixed(2)}`);
  $('#openStats').setAttribute('aria-label', `Statistikk: ${n} av ${N} sett`);
  ticks.forEach((t, i) => { t.classList.toggle('s', Store.has(CARDS[i].key)); t.classList.toggle('c', i === cur); });
  scrub.setAttribute('aria-valuenow', cur + 1);
  scrub.setAttribute('aria-valuetext', `Kort ${cur + 1}: ${c.navn}`);
}

let hintCount = lsGet('hagefugler-oslo:hint') === 'ok' ? 99 : 0;
if (hintCount > 3) $('#hint').classList.add('gone');
function nudgeHint() { if (++hintCount === 4) { $('#hint').classList.add('gone'); lsSet('hagefugler-oslo:hint', 'ok'); } }

/* ================= Sheets ================= */
let openSheet = null, lastFocus = null;
const app = $('#app'), scrim = $('#scrim');
function showSheet(el) {
  if (openSheet === el) return;
  closeSheets(true);
  lastFocus = document.activeElement;
  openSheet = el;
  el.classList.add('on'); scrim.classList.add('on'); app.inert = true;
}
function closeSheets(silent) {
  if (!openSheet) return;
  openSheet.classList.remove('on'); scrim.classList.remove('on', 'dark'); app.inert = false;
  openSheet = null;
  if (!silent && lastFocus && lastFocus.focus) lastFocus.focus();
}
scrim.addEventListener('click', () => closeSheets());

/* ---- search ---- */
const qEl = $('#q'), resEl = $('#results');
let filter = 'alle';
function openSearch() { showSheet($('#searchSheet')); renderSearch(); setTimeout(() => qEl.focus(), 60); }
$('#openSearch').addEventListener('click', openSearch);
$('#closeSearch').addEventListener('click', () => closeSheets());
qEl.addEventListener('input', renderSearch);
qEl.addEventListener('keydown', e => { if (e.key === 'Enter') { const first = resEl.querySelector('.res'); if (first) first.click(); } });
document.querySelectorAll('.chip').forEach(ch => ch.addEventListener('click', () => {
  filter = ch.dataset.f;
  document.querySelectorAll('.chip').forEach(x => x.setAttribute('aria-pressed', x === ch ? 'true' : 'false'));
  renderSearch();
}));
function hl(orig, n, terms) {
  const marks = new Array(orig.length).fill(false);
  terms.forEach(t => { let p = n.s.indexOf(t); while (p !== -1) { for (let k = p; k < p + t.length; k++) marks[n.map[k]] = true; p = n.s.indexOf(t, p + 1); } });
  let out = '', on = false;
  for (let i = 0; i < orig.length; i++) {
    if (marks[i] && !on) { out += '<mark>'; on = true; }
    if (!marks[i] && on) { out += '</mark>'; on = false; }
    out += esc(orig[i]);
  }
  return out + (on ? '</mark>' : '');
}
function snippet(orig, n, terms) {
  const p = n.s.indexOf(terms[0]); const at = p < 0 ? 0 : n.map[p];
  let a = Math.max(0, at - 38), b = Math.min(orig.length, at + 70);
  if (a > 0) { const sp = orig.indexOf(' ', a); if (sp > -1 && sp < at) a = sp + 1; }
  const part = orig.slice(a, b);
  return (a > 0 ? '…' : '') + hl(part, norm(part), terms) + (b < orig.length ? '…' : '');
}
function renderSearch() {
  const q = norm(qEl.value.trim()).s;
  const terms = q.split(/\s+/).filter(Boolean);
  const out = [];
  CARDS.forEach((c, i) => {
    const seen = Store.has(c.key);
    if (filter === 'sett' && !seen) return;
    if (filter === 'ikke' && seen) return;
    if (!terms.length) { out.push({ i, score: 0 }); return; }
    let score = 0, hit = null;
    for (const t of terms) {
      let best = 0, bestF = null;
      for (const [k, , w] of FIELDS) {
        const s = IDX[i][k].s; const p = s.indexOf(t);
        if (p < 0) continue;
        let sc = w + (p === 0 || s[p - 1] === ' ' ? w * 0.5 : 0);
        if (k === 'navn' && p === 0) sc += 80;
        if (sc > best) { best = sc; bestF = k; }
      }
      if (!best) return;
      score += best;
      if (bestF !== 'navn' && bestF !== 'latin' && !hit) hit = bestF;
    }
    out.push({ i, score, hit });
  });
  out.sort((a, b) => b.score - a.score || a.i - b.i);
  $('#count').textContent = `${out.length} kort`;
  if (!out.length) {
    resEl.innerHTML = `<li class="empty">Ingen kort passer${qEl.value ? ` til «${esc(qEl.value)}»` : ''}. Prøv et annet ord, for eksempel en farge eller «hakkespett».</li>`;
    return;
  }
  resEl.innerHTML = out.map(({ i, hit }) => {
    const c = CARDS[i], s = Store.get(c.key);
    const label = hit ? FIELDS.find(f => f[0] === hit)[1] : '';
    return `<li><button class="res" data-i="${i}">
      <span class="ph" style="background-position:${spritePos(i)}" aria-hidden="true"></span>
      <span class="t"><span class="n">${terms.length ? hl(c.navn, IDX[i].navn, terms) : esc(c.navn)}</span>
        <span class="l">${terms.length ? hl(c.latin, IDX[i].latin, terms) : esc(c.latin)}</span>
        ${hit ? `<span class="sn"><em>${label}:</em> ${snippet(c[hit], IDX[i][hit], terms)}</span>` : ''}</span>
      <span class="r">${s ? `<span class="okdot" title="Sett første gang ${fmtLong(s.date)}, ${dagerTekst(s.dager.length)}">${CHECK}</span>` : `<span>${c.id}</span>`}${stars(c.stjerner)}</span>
    </button></li>`;
  }).join('');
}
resEl.addEventListener('click', e => {
  const b = e.target.closest('.res'); if (!b) return;
  closeSheets(true);
  jump(+b.dataset.i);
  stage.focus && stage.focus();
});

/* ---- help: the two explanation cards ---- */
const helpSheet = $('#helpSheet'), helpTrack = $('#helpTrack'), helpDots = $('#helpDots');
const hjelpListe = () => (foto() && DATA.hjelpFoto) || DATA.hjelp || [];
function renderHelp() {
  const HJELP = hjelpListe();
  $('#openHelp').hidden = !HJELP.length;
  helpTrack.innerHTML = HJELP.map(h => `<figure class="help-card"><img src="${esc(h.bilde)}" alt="${esc(h.navn)}" loading="lazy" decoding="async"></figure>`).join('');
  helpDots.innerHTML = HJELP.map((h, k) => `<button role="tab" aria-selected="${k === 0}" aria-label="${esc(h.navn)}" data-k="${k}"></button>`).join('');
}
renderHelp();
const helpIndex = () => { const w = helpTrack.firstElementChild ? helpTrack.firstElementChild.offsetWidth + 18 : 1; return Math.round(helpTrack.scrollLeft / w); };
helpTrack.addEventListener('scroll', () => { const k = helpIndex(); helpDots.querySelectorAll('button').forEach((b, j) => b.setAttribute('aria-selected', j === k)); }, { passive: true });
helpDots.addEventListener('click', e => { const b = e.target.closest('button'); if (b) helpTrack.children[+b.dataset.k].scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' }); });
function openHelp() { showSheet(helpSheet); scrim.classList.add('dark'); helpTrack.scrollLeft = 0; setTimeout(() => $('#closeHelp').focus(), 60); }
$('#openHelp').addEventListener('click', openHelp);
$('#closeHelp').addEventListener('click', () => closeSheets());
helpSheet.addEventListener('click', e => { if (!e.target.closest('.help-card, .help-bar')) closeSheets(); });

/* ---- innstillinger ---- */
const setSheet = $('#settingsSheet');
$('#openSettings').hidden = !HAR_FOTO;
$('#fotoAntall').textContent = `Fotografier fra Artsdatabanken og Artsobservasjoner for ${CARDS.filter(c => c.bildeFoto).length} av ${N} arter. De andre viser illustrasjonen. Fotografene står på kortet Bildekreditering under ?.`;
function paintSettings() { setSheet.querySelectorAll('[data-bilder]').forEach(b => b.setAttribute('aria-checked', b.dataset.bilder === bildevalg)); }
function openSettings() { paintSettings(); showSheet(setSheet); setTimeout(() => setSheet.querySelector('[aria-checked="true"]').focus(), 60); }
function settBilder(v) {
  if (v === bildevalg || !HAR_FOTO) return;
  bildevalg = v; lsSet('hagefugler:bilder', v);
  settSprites();
  pool.forEach(el => { const c = CARDS[+el.dataset.i], img = el.querySelector('.front img'); img.src = bildeAv(c); img.alt = altTekst(c); });
  renderHelp(); paintSettings(); setTimeout(warm, 300);
  toast(v === 'foto' ? 'Kortene viser nå fotografier der de finnes.' : 'Kortene viser nå KI-illustrasjoner.');
}
$('#openSettings').addEventListener('click', openSettings);
$('#closeSettings').addEventListener('click', () => closeSheets());
setSheet.addEventListener('click', e => { const b = e.target.closest('[data-bilder]'); if (b) settBilder(b.dataset.bilder); });
setSheet.addEventListener('keydown', e => {
  if (!['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key) || !e.target.closest('[data-bilder]')) return;
  e.preventDefault(); settBilder(bildevalg === 'ki' ? 'foto' : 'ki'); setSheet.querySelector('[aria-checked="true"]').focus();
});

/* ---- stats ---- */
const sb = $('#statsBody');
function openStats() { showSheet($('#statsSheet')); renderStats(); setTimeout(() => $('#closeStats').focus(), 60); }
$('#openStats').addEventListener('click', openStats);
$('#closeStats').addEventListener('click', () => closeSheets());
function renderStats() {
  const ids = Object.keys(Store.data).filter(k => BY_KEY[k] != null);
  const n = ids.length;
  const byRar = [1, 2, 3, 4, 5].map(r => ({ r, tot: CARDS.filter(c => c.stjerner === r).length, seen: CARDS.filter(c => c.stjerner === r && Store.has(c.key)).length }));
  const ptsMax = CARDS.reduce((a, c) => a + c.stjerner, 0);
  const pts = CARDS.reduce((a, c) => a + (Store.has(c.key) ? c.stjerner : 0), 0);
  const rarest = CARDS.filter(c => Store.has(c.key)).sort((a, b) => b.stjerner - a.stjerner || a.nr - b.nr)[0];
  // last 12 months
  const now = new Date(); const months = [];
  for (let k = 11; k >= 0; k--) { const d = new Date(now.getFullYear(), now.getMonth() - k, 1); months.push({ y: d.getFullYear(), m: d.getMonth() + 1, n: 0 }); }
  ids.forEach(id => { const [y, m] = Store.data[id].date.split('-').map(Number); const b = months.find(x => x.y === y && x.m === m); if (b) b.n++; });
  const maxM = Math.max(1, ...months.map(x => x.n));
  const inYear = months.reduce((a, x) => a + x.n, 0);
  const last = id => Store.data[id].dager[Store.data[id].dager.length - 1];
  const recent = ids.map(id => ({ id, d: last(id), ant: Store.data[id].dager.length, ts: Store.data[id].ts }))
    .sort((a, b) => (b.d > a.d ? 1 : b.d < a.d ? -1 : b.ts - a.ts)).slice(0, 6);
  const cardOf = key => BY_KEY[key];
  const obsDager = new Set(ids.flatMap(id => Store.data[id].dager)).size;
  const regs = ids.reduce((a, id) => a + Store.data[id].dager.length, 0);
  const most = ids.map(id => ({ c: CARDS[BY_KEY[id]], ant: Store.data[id].dager.length })).sort((a, b) => b.ant - a.ant || a.c.nr - b.c.nr)[0];

  sb.innerHTML = `
    <div class="hero"><span class="big">${n}</span><span class="of">av ${N} arter sett</span></div>
    <div class="bar" role="img" aria-label="${Math.round(n / N * 100)} prosent av kortstokken"><i style="width:${(n / N * 100).toFixed(1)}%"></i></div>
    <div class="kpis">
      <div class="kpi"><b>${pts} <small style="font-size:14px;color:var(--muted)">/ ${ptsMax}</small></b><span>Poeng. Hvert kort gir like mange poeng som det har stjerner.</span></div>
      <div class="kpi"><b>${rarest ? esc(rarest.navn) : '–'}</b><span>${rarest ? `Sjeldneste funn, ${rarest.stjerner} ${rarest.stjerner === 1 ? 'stjerne' : 'stjerner'}` : 'Sjeldneste funn vises her'}</span></div>
      <div class="kpi"><b>${obsDager}</b><span>${obsDager === 1 ? 'Observasjonsdag' : 'Observasjonsdager'}, med ${regs} ${regs === 1 ? 'registrering' : 'registreringer'} i alt</span></div>
      <div class="kpi"><b>${most && most.ant > 1 ? esc(most.c.navn) : '–'}</b><span>${most && most.ant > 1 ? `Sett flest dager, ${most.ant} i alt` : 'Fuglen du har sett flest dager, vises her'}</span></div>
    </div>

    <div class="s-sec"><h3>Etter sjeldenhet</h3><div class="rar">
      ${byRar.map(x => `<div class="rrow">${stars(x.r)}<div class="lab"><span>${RAR[x.r]}</span><div class="bar"><i style="width:${(x.seen / x.tot * 100).toFixed(1)}%"></i></div></div><span class="num">${x.seen}/${x.tot}</span></div>`).join('')}
    </div></div>

    <div class="s-sec"><h3>Nye arter per måned</h3>
      <div class="months" id="months">
        ${months.map((x, k) => `<button class="mcol ${x.n ? '' : 'zero'}" data-k="${k}" style="--h:${(x.n / maxM * 100).toFixed(1)}%" aria-label="${MND[x.m - 1]} ${x.y}: ${x.n} ${x.n === 1 ? 'art' : 'arter'}"><i style="height:${(x.n / maxM * 100).toFixed(1)}%"></i>${x.n === maxM && x.n > 0 ? `<span class="v">${x.n}</span>` : ''}</button>`).join('')}
        <div class="tip" id="mtip"></div>
      </div>
      <div class="mlabels">${months.map(x => `<span>${MND[x.m - 1]}</span>`).join('')}</div>
      <p class="cap">${n ? `${inYear} ${inYear === 1 ? 'art' : 'arter'} krysset av de siste 12 månedene.` : 'Ingen avkrysninger ennå. Trykk på SETT-ruta nederst på et kort når du ser fuglen.'}</p>
    </div>

    ${recent.length ? `<div class="s-sec"><h3>Sist sett</h3><ul class="recent">
      ${recent.map(r => { const i = cardOf(r.id), c = CARDS[i]; return `<li><button data-i="${i}"><span class="ph" style="background-position:${spritePos(i)}" aria-hidden="true"></span><span><b style="font-weight:600">${esc(c.navn)}</b><br><span style="font-size:12.5px;color:var(--muted)">${esc(RAR[c.stjerner])} · ${dagerTekst(r.ant)}</span></span><span class="d">${fmtHand(r.d)}</span></button></li>`; }).join('')}
    </ul></div>` : ''}

    <div class="s-sec"><h3>Samlingen</h3><div class="album">
      ${CARDS.map((c, i) => `<button class="alb ${Store.has(c.key) ? 's' : ''}" data-i="${i}" aria-label="${esc(c.navn)}${Store.has(c.key) ? ', sett' : ', ikke sett'}"><span class="th" style="background-position:${spritePos(i)}"></span><span class="nr">${c.nr}</span><span class="okdot">${CHECK}</span></button>`).join('')}
    </div></div>

    <div class="s-sec"><h3>Lagring</h3>
      <p class="store ${Store.mode === 'delt' ? 'sky' : ''}"><i></i>${Store.mode === 'delt' ? 'Avkrysningene lagres sammen med kortstokken og følger deg på alle enheter.' : 'Avkrysningene lagres på denne enheten.'}</p>
      <div class="row"><button class="btn" id="copyBackup">Kopier sikkerhetskopi</button><button class="btn" id="showRestore">Gjenopprett</button></div>
      <div class="restore" id="restoreBox" hidden>
        <label for="restoreTxt" style="font-size:13px;color:var(--muted)">Lim inn en sikkerhetskopi. Avkrysningene i den legges til de du har.</label>
        <textarea id="restoreTxt" spellcheck="false"></textarea>
        <div><button class="btn pri" id="doRestore">Legg til avkrysningene</button></div>
      </div>
    </div>`;

  const tip = $('#mtip'), mEl = $('#months');
  const showTip = b => { const x = months[+b.dataset.k]; tip.textContent = `${MND[x.m - 1]}. ${x.y}: ${x.n} ${x.n === 1 ? 'art' : 'arter'}`; const r = b.getBoundingClientRect(), pr = mEl.getBoundingClientRect(); tip.style.left = (r.left - pr.left + r.width / 2) + 'px'; tip.style.top = Math.max(0, r.bottom - pr.top - (b.querySelector('i').offsetHeight) - 6) + 'px'; tip.classList.add('on'); };
  mEl.querySelectorAll('.mcol').forEach(b => { b.addEventListener('pointerenter', () => showTip(b)); b.addEventListener('focus', () => showTip(b)); b.addEventListener('click', () => showTip(b)); b.addEventListener('pointerleave', () => tip.classList.remove('on')); b.addEventListener('blur', () => tip.classList.remove('on')); });
}
sb.addEventListener('click', async e => {
  const j = e.target.closest('[data-i]');
  if (j) { closeSheets(true); jump(+j.dataset.i); return; }
  if (e.target.id === 'copyBackup') {
    const txt = JSON.stringify({ kortstokk: 'hagefugler', versjon: 3, sett: Store.data });
    try { await navigator.clipboard.writeText(txt); toast('Sikkerhetskopien er kopiert. Lim den inn i et notat eller en e-post til deg selv.'); }
    catch (err) { $('#restoreBox').hidden = false; const t = $('#restoreTxt'); t.value = txt; t.select(); toast('Kopier teksten i feltet manuelt.'); }
  }
  if (e.target.id === 'showRestore') { $('#restoreBox').hidden = false; $('#restoreTxt').value = ''; $('#restoreTxt').focus(); }
  if (e.target.id === 'doRestore') {
    try {
      const obj = JSON.parse($('#restoreTxt').value);
      // older copies have one date per bird, newer ones a list of days; either way the days are added to the ones here
      const src = entries(obj.sett || obj); migrateKeys(src);
      let arter = 0, dager = 0; const merged = { ...Store.data };
      Object.keys(src).forEach(id => {
        if (BY_KEY[id] == null) return;
        const had = merged[id] ? merged[id].dager : [];
        const nye = src[id].dager.filter(d => !had.includes(d));
        if (!nye.length) return;
        if (!had.length) arter++;
        dager += nye.length;
        merged[id] = { ...entry({ dager: [...had, ...nye] }), ts: Date.now() };
      });
      if (dager) Store.replaceAll(merged);
      toast(dager ? `La til ${dager} ${dager === 1 ? 'dag' : 'dager'}${arter ? `, ${arter} ${arter === 1 ? 'ny art' : 'nye arter'}` : ''}.` : 'Ingen nye dager i sikkerhetskopien.');
    } catch (err) { toast('Teksten er ikke en gyldig sikkerhetskopi. Lim inn hele teksten du kopierte.'); }
  }
});

/* ---- toast ---- */
let toastT = 0;
function toast(msg, action, fn) {
  const t = $('#toast'), b = $('#toastBtn');
  $('#toastMsg').textContent = msg;
  b.hidden = !action; b.textContent = action || '';
  b.onclick = () => { t.classList.remove('on'); fn && fn(); };
  t.classList.add('on');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), action ? 6000 : 3800);
}

/* ---- react to data ---- */
Store.on(() => {
  pool.forEach(paintCard);
  paintChrome();
  if (openSheet && openSheet.id === 'statsSheet') renderStats();
  if (openSheet && openSheet.id === 'searchSheet') renderSearch();
});

let rz = 0;
addEventListener('resize', () => { cancelAnimationFrame(rz); rz = requestAnimationFrame(() => sync({ instant: true })); });

// preload neighbours of neighbours so fast swiping never shows a blank card
function warm() { [5, 6, 7, -3, -4].forEach(d => { const img = new Image(); img.decoding = 'async'; img.src = bildeAv(CARDS[mod(cur + d)]); }); }

sync();
announce();
setTimeout(warm, 600);
Store.connectRemote();
})();
</script>
